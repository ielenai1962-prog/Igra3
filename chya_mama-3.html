<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чья мама?</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4dc,#e9f5ff);min-height:100vh;display:flex;justify-content:center;align-items:center;color:#24324a}
.game{width:min(960px,96vw);background:white;border-radius:30px;padding:24px;box-shadow:0 12px 40px #0002}
h1{text-align:center;font-size:clamp(30px,6vw,48px);margin:0 0 8px}
.instruction{text-align:center;font-size:20px;margin:0 0 15px}
.progress{text-align:center;font-weight:bold;font-size:19px;margin-bottom:18px}
.childBox{display:flex;justify-content:center;margin-bottom:22px}
.child{width:min(260px,65vw);height:190px;border-radius:28px;background:#fff7d6;border:5px solid #ffd45c;display:flex;flex-direction:column;align-items:center;justify-content:center}
.child .emoji{font-size:92px;line-height:1}
.child .name{font-size:23px;font-weight:bold;margin-top:5px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.option{border:0;border-radius:25px;background:#f5f7fb;padding:16px;cursor:pointer;box-shadow:0 5px 14px #0002;transition:.18s}
.option:hover{transform:translateY(-5px);background:#eef4ff}
.option:active{transform:scale(.97)}
.animal{height:150px;display:flex;align-items:center;justify-content:center;font-size:105px}
.label{font-size:24px;font-weight:bold}
.message{text-align:center;min-height:42px;margin-top:20px;font-size:25px;font-weight:bold}
.next{display:none;margin:0 auto;border:0;border-radius:18px;background:#6c5ce7;color:white;font-size:21px;font-weight:bold;padding:14px 28px;cursor:pointer}
.next.show{display:block}
.finish{font-size:28px;color:#159957}
@media(max-width:650px){
 .options{grid-template-columns:1fr}
 .option{display:flex;align-items:center;gap:14px}
 .animal{height:100px;font-size:75px;width:100px}
 .label{font-size:21px}
 .child{height:160px}
 .child .emoji{font-size:75px}
}
</style>
</head>
<body>
<div class="game">
  <h1>🐾 Чья мама?</h1>
  <p class="instruction">Посмотри на детёныша и выбери его маму.</p>
  <div class="progress">Задание <span id="round">1</span> из 4 &nbsp; • &nbsp; Правильно: <span id="score">0</span></div>

  <div class="childBox">
    <div class="child">
      <div class="emoji" id="childEmoji">🐱</div>
      <div class="name" id="childName">Котёнок</div>
    </div>
  </div>

  <div class="options" id="options"></div>
  <div class="message" id="message"></div>
  <button class="next" id="next">Следующее ➜</button>
</div>

<script>
const rounds=[
 {child:"🐱",childName:"Котёнок",mother:"Кошка",correct:"🐱",choices:[
   ["🐄","Корова","🐄"],["🐱","Кошка","🐱"],["🐑","Овца","🐑"]]},
 {child:"🐶",childName:"Щенок",mother:"Собака",correct:"🐶",choices:[
   ["🐶","Собака","🐶"],["🐄","Корова","🐄"],["🐑","Овца","🐑"]]},
 {child:"🐮",childName:"Телёнок",mother:"Корова",correct:"🐮",choices:[
   ["🐑","Овца","🐑"],["🐮","Корова","🐮"],["🐱","Кошка","🐱"]]},
 {child:"🐑",childName:"Ягнёнок",mother:"Овца",correct:"🐑",choices:[
   ["🐶","Собака","🐶"],["🐱","Кошка","🐱"],["🐑","Овца","🐑"]]}
];

let current=0, score=0, answered=false;
const $=id=>document.getElementById(id);

function render(){
  const r=rounds[current];
  $("round").textContent=current+1;
  $("childEmoji").textContent=r.child;
  $("childName").textContent=r.childName;
  $("message").textContent="";
  $("next").classList.remove("show");
  answered=false;
  const box=$("options"); box.innerHTML="";
  [...r.choices].sort(()=>Math.random()-0.5).forEach(([emoji,name,id])=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<div class="animal">${emoji}</div><div class="label">${name}</div>`;
    b.onclick=()=>choose(id,b,name);
    box.appendChild(b);
  });
}
function choose(id,button,name){
  if(answered)return;
  answered=true;
  if(id===rounds[current].correct){
    score++;
    $("score").textContent=score;
    $("message").textContent="🎉 Правильно! Это мама "+name+"!";
    button.style.outline="6px solid #35b66f";
  }else{
    $("message").textContent="🌟 Попробуй ещё раз!";
    answered=false;
    button.style.outline="5px solid #ff9b9b";
  }
  if(answered){
    $("next").classList.add("show");
    document.querySelectorAll(".option").forEach(b=>b.style.pointerEvents="none");
  }
}
$("next").onclick=()=>{
  current++;
  if(current<rounds.length) render();
  else{
    $("childBox").style.display="none";
    $("options").style.display="none";
    $("next").style.display="none";
    $("message").className="message finish";
    $("message").innerHTML=`🏆 Молодец! Ты нашёл всех мам!<br>Результат: ${score} из 4`;
  }
};
render();
</script>
</body>
</html>
